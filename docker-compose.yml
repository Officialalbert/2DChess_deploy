services:
  postgres:
    image: postgres:16-alpine
    container_name: chessmap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:}
      POSTGRES_DB: ${POSTGRES_DB:}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chessmap}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chessmap_net
  redis:
    image: redis:7-alpine
    container_name: chessmap_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chessmap_net
  api:
    build: ./api
    container_name: chessmap_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chessmap_net

  worker:
    build: ./worker
    container_name: chessmap_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chessmap_net

  nginx:
    image: nginx:1.27-alpine
    container_name: chessmap_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - chessmap_net

volumes:
  postgres_data:

networks:
  chessmap_net:
    driver: bridge
